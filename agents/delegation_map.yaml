# ════════════════════════════════════════════════════════════════════════════
# Delegation Map — fonte única do roteamento "Situação → Agente"
# ════════════════════════════════════════════════════════════════════════════
# Regra: adicionar agente = editar este YAML; a tabela markdown em
# kb/task_routing.md §2 é regenerada a partir daqui (agents/delegation.py).
#
# Campos:
#   situation  — rótulo humano exibido na tabela markdown
#   agent      — slug do agente (tem que existir em agents/registry/<slug>.md)
#   tier       — T0/T1/T2/T3 (informativo; fonte de verdade é o frontmatter do registry)
#   keywords   — (opcional) palavras-chave para classificação programática futura
# ════════════════════════════════════════════════════════════════════════════

routes:
  # Migração
  - situation: "Migração SQL Server/PostgreSQL → Databricks/Fabric"
    agent: migration-expert
    tier: T1
    keywords: [migração, migration, "sql-server", "sql server", postgres, postgresql]
  - situation: "/migrate ou assessment de banco relacional"
    agent: migration-expert
    tier: T1
    keywords: [migrate, assessment, cutover]
  - situation: "DDL de origem extraído → propor Medallion"
    agent: migration-expert
    tier: T1
    keywords: [ddl, medallion, assessment]

  # Intake de requisitos
  - situation: "Transcript / briefing / notas brutas"
    agent: business-analyst
    tier: T0
    keywords: [transcript, briefing, reunião, ata, notas]
  - situation: "Input não estruturado antes do /plan"
    agent: business-analyst
    tier: T0
    keywords: [brief, intake, requisitos]

  # Qualidade
  - situation: "Tabela nova ingerida → validar qualidade"
    agent: data-quality-steward
    tier: T2
    keywords: [qualidade, validação, expectations, profiling]
  - situation: "Alerta de qualidade disparado → investigar"
    agent: data-quality-steward
    tier: T2
    keywords: [alerta, SLA, violação]
  - situation: "Schema drift em streaming"
    agent: data-quality-steward
    tier: T2
    keywords: ["schema drift", "data drift", streaming]

  # Governança
  - situation: "Pipeline modificado → verificar conformidade"
    agent: governance-auditor
    tier: T2
    keywords: [conformidade, auditoria, compliance]
  - situation: "Acesso incomum detectado → auditar"
    agent: governance-auditor
    tier: T2
    keywords: [acesso, audit, permissões]
  - situation: "Dados PII expostos → classificar e proteger"
    agent: governance-auditor
    tier: T2
    keywords: [PII, LGPD, GDPR, sensível]

  # Modelagem semântica e BI
  - situation: "Gold Layer criada → preparar para consumo BI"
    agent: semantic-modeler
    tier: T2
    keywords: [gold, BI, consumo]
  - situation: "Semantic Model mencionado (Fabric/Power BI/DAX)"
    agent: semantic-modeler
    tier: T2
    keywords: ["semantic model", "power bi", DAX, "direct lake"]
  - situation: "Criar/atualizar Genie Space (Databricks)"
    agent: semantic-modeler
    tier: T2
    keywords: [genie, "conversational bi"]
  - situation: "Criar/publicar AI/BI Dashboard (Databricks)"
    agent: semantic-modeler
    tier: T2
    keywords: [dashboard, "ai/bi", aibi]
  - situation: "Consultar endpoint de modelo ML/GenAI"
    agent: semantic-modeler
    tier: T2
    keywords: ["model serving", mlflow, endpoint]
  - situation: "Relatório de métricas / análise consumível"
    agent: semantic-modeler
    tier: T2
    keywords: [métricas, KPI, relatório]

  # Pipelines e infraestrutura
  - situation: "Criar Knowledge Assistant (KA) / Mosaic (MAS)"
    agent: pipeline-architect
    tier: T1
    keywords: [KA, MAS, "knowledge assistant", mosaic]
  - situation: "Executar código serverless / criar cluster/warehouse"
    agent: pipeline-architect
    tier: T1
    keywords: [serverless, cluster, warehouse, execute_code]

  # SQL e Spark
  - situation: "Múltiplas queries SQL independentes em paralelo"
    agent: sql-expert
    tier: T1
    keywords: [execute_sql_multi, "queries paralelas"]
  - situation: "PySpark / Spark SQL / DLT"
    agent: spark-expert
    tier: T1
    keywords: [pyspark, "spark sql", dlt, lakeflow, delta]

  # dbt
  - situation: "dbt (models, refs, sources, testes, snapshots)"
    agent: dbt-expert
    tier: T2
    keywords: [dbt, models, refs, snapshot, "dbt test", "dbt run"]

  # Python puro
  - situation: "Python puro (pacotes, APIs, CLIs, pandas/polars)"
    agent: python-expert
    tier: T1
    keywords: [python, pandas, polars, fastapi, typer, pytest, pydantic]

  # Operações
  - situation: "Alerta de negócio recebido (estoque, vendas, SLA)"
    agent: business-monitor
    tier: T2
    keywords: [alerta, estoque, vendas, "sla violado"]

  # AI e GenAI aplicados a dados
  - situation: "Pipeline RAG / Vector Search / embeddings"
    agent: ai-data-engineer
    tier: T1
    keywords: [rag, vector, embedding, embeddings, "vector search", llmops]
  - situation: "AI Functions (AI_QUERY, AI_SUMMARIZE) no Databricks"
    agent: ai-data-engineer
    tier: T1
    keywords: ["ai functions", "ai_query", "ai_summarize", "ai_classify", llm, genai]
  - situation: "LLMOps: MLflow evaluation, model registry, serving"
    agent: ai-data-engineer
    tier: T1
    keywords: [mlflow, "model serving", evaluation, "feature store", llmops]

  # Streaming e tempo real
  - situation: "Kafka / Flink / Spark Structured Streaming"
    agent: streaming-engineer
    tier: T1
    keywords: [kafka, flink, streaming, "structured streaming", "spark streaming"]
  - situation: "Fabric RTI / Eventhouse / KQL"
    agent: streaming-engineer
    tier: T1
    keywords: [rti, eventhouse, kql, kusto, "real-time intelligence"]
  - situation: "Watermarks, late data, exactly-once"
    agent: streaming-engineer
    tier: T1
    keywords: [watermark, "late data", "exactly-once", "at-least-once", trigger]

  # CDC — Change Data Capture
  - situation: "Debezium / Kafka Connect CDC"
    agent: cdc-specialist
    tier: T1
    keywords: [debezium, "kafka connect", cdc, binlog, wal, "change data capture"]
  - situation: "AUTO CDC INTO (Databricks DLT)"
    agent: cdc-specialist
    tier: T1
    keywords: ["auto cdc", "apply changes", "apply changes into", scd2, cdc]
  - situation: "Transactional outbox / CQRS"
    agent: cdc-specialist
    tier: T1
    keywords: [outbox, cqrs, saga, "event sourcing"]

  # Data Contracts
  - situation: "Data Contract / ODCS / SLA de qualidade contratual"
    agent: data-contracts-engineer
    tier: T2
    keywords: ["data contract", odcs, contrato, "schema evolution", "breaking change"]
  - situation: "Breaking change em schema → impacto em consumidores"
    agent: data-contracts-engineer
    tier: T2
    keywords: ["breaking change", "schema change", deprecation, compatibility]

  # Schema Design
  - situation: "Star Schema / Data Vault 2.0 / SCD"
    agent: schema-designer
    tier: T2
    keywords: ["star schema", "data vault", scd, "slowly changing", dimensional, hub, satellite]
  - situation: "Grain definition / modelagem dimensional"
    agent: schema-designer
    tier: T2
    keywords: [grain, dimensional, fato, dimensão, snowflake, "fact table"]

  # FinOps / Otimização de Custo
  - situation: "Custo de DBU / CU elevado → investigar e otimizar"
    agent: cost-optimizer
    tier: T2
    keywords: [dbu, cu, custo, cost, "rightsizing", otimização, finops]
  - situation: "Rightsizing de cluster / warehouse / capacidade"
    agent: cost-optimizer
    tier: T2
    keywords: [rightsizing, cluster, capacidade, "serverless", "all-purpose", budget]

  # Data Mesh
  - situation: "Data Mesh: domínios, Data Products, governança federada"
    agent: data-mesh-architect
    tier: T2
    keywords: ["data mesh", "data product", domínio, "self-serve", "federated governance"]
  - situation: "Mapeamento de domínios de negócio → plataforma de dados"
    agent: data-mesh-architect
    tier: T2
    keywords: [domínio, domain, ownership, "data product"]

  # Diagnóstico Spark
  - situation: "Job Spark com OOM / data skew / shuffle excessivo"
    agent: spark-diagnostics
    tier: T2
    keywords: [oom, skew, shuffle, spill, "out of memory", "spark ui", aqe]
  - situation: "Job Spark travado / hung / timeout"
    agent: spark-diagnostics
    tier: T2
    keywords: [hung, hang, timeout, deadlock, "driver timeout", "executor lost"]
  - situation: "Pipeline DLT com falhas recorrentes"
    agent: spark-diagnostics
    tier: T2
    keywords: [dlt, lakeflow, "pipeline failure", "pipeline error", "expectations failed"]

  # Medallion Architecture
  - situation: "Design de camadas Bronze / Silver / Gold"
    agent: medallion-architect
    tier: T2
    keywords: [bronze, silver, gold, medallion, camada, layer]
  - situation: "STREAMING TABLE vs MATERIALIZED VIEW vs tabela Delta"
    agent: medallion-architect
    tier: T2
    keywords: ["streaming table", "materialized view", "delta table", artefato]
  - situation: "Particionamento e schema evolution por camada Medallion"
    agent: medallion-architect
    tier: T2
    keywords: [particionamento, partition, "schema evolution", "z-order", "liquid clustering"]

  # Conceitual
  - situation: "Pergunta conceitual sem MCP"
    agent: geral
    tier: T3
    keywords: [conceito, explique, "o que é"]
